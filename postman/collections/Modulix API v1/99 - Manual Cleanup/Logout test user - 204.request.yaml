$kind: http-request
url: "{{baseUrl}}/api/auth/logout"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{userRefreshToken}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 1000
