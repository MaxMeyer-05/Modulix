$kind: http-request
url: "{{baseUrl}}/api/users/me"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{testUserPassword}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 2000
