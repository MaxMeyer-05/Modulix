$kind: http-request
url: "{{baseUrl}}/api/modules-management/modules/{{moduleId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "moduleName": "{{moduleName}} updated",
      "description": "{{moduleDescription}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 3000