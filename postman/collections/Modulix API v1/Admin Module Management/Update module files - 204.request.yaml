$kind: http-request
url: "{{baseUrl}}/api/modules-management/modules/{{moduleId}}/files"
method: PUT
body:
  type: formdata
  content:
    - key: ModuleFile
      type: file
      src: "{{moduleReplacementZipPath}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 4000