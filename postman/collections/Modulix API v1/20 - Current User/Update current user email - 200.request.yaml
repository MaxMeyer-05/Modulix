$kind: http-request
url: "{{baseUrl}}/api/users/me"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userEmail": "{{updatedUserEmail}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const payload = pm.response.json();
      pm.environment.set('testUserEmail', pm.environment.get('updatedUserEmail'));
      pm.environment.set('userAccessToken', payload.accessToken);
      pm.environment.set('userRefreshToken', payload.refreshToken);
    language: text/javascript
order: 2000
