$kind: http-request
url: "{{baseUrl}}/api/users/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Response belongs to test user', () => pm.expect(pm.response.json().id).to.eql(pm.environment.get('testUserId')));
    language: text/javascript
order: 1000
