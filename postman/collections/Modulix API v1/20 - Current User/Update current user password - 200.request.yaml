$kind: http-request
url: "{{baseUrl}}/api/users/me/password"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{testUserPassword}}",
      "newPassword": "{{replacementUserPassword}}",
      "confirmNewPassword": "{{replacementUserPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const payload = pm.response.json();
      pm.environment.set('testUserPassword', pm.environment.get('replacementUserPassword'));
      pm.environment.set('userAccessToken', payload.accessToken);
      pm.environment.set('userRefreshToken', payload.refreshToken);
    language: text/javascript
order: 3000
