$kind: http-request
url: "{{baseUrl}}/api/users/token/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{userRefreshToken}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const payload = pm.response.json();
      pm.environment.set('userAccessToken', payload.accessToken);
      pm.environment.set('userRefreshToken', payload.refreshToken);
    language: text/javascript
order: 1000
