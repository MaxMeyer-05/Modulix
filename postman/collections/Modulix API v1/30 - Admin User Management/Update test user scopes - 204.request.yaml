$kind: http-request
url: "{{baseUrl}}/api/users/{{testUserId}}/scopes"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "allowedScopes": [
        "reports.read",
        "profile.write"
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 3000
