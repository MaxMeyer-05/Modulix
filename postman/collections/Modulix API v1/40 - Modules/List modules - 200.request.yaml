$kind: http-request
url: "{{baseUrl}}/api/modules-management/modules"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Response is a module list', () => {
        pm.expect(pm.response.json()).to.be.an('array');
      });
    language: text/javascript
order: 1000