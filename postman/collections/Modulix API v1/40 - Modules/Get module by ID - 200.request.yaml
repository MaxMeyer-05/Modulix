$kind: http-request
url: "{{baseUrl}}/api/modules-management/modules/{{moduleId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Response contains the selected module', () => {
        const module = pm.response.json();
        pm.expect(module.id).to.eql(pm.variables.get('moduleId'));
        pm.expect(module.endpoints).to.be.an('array');
      });
    language: text/javascript
order: 2000