$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userEmail": "{{testUserEmail}}",
      "userPassword": "incorrect-password"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 1000
