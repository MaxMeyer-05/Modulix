$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userEmail": "{{testUserEmail}}",
      "userPassword": "{{testUserPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const payload = pm.response.json();
      pm.test('Response contains user and token pair', () => {
          pm.expect(payload.user.id).to.be.a('string').and.not.empty;
          pm.expect(payload.tokenResult.accessToken).to.be.a('string').and.not.empty;
          pm.expect(payload.tokenResult.refreshToken).to.be.a('string').and.not.empty;
      });
      pm.environment.set('testUserId', payload.user.id);
      pm.environment.set('userAccessToken', payload.tokenResult.accessToken);
      pm.environment.set('userRefreshToken', payload.tokenResult.refreshToken);
    language: text/javascript
order: 2000
