$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userEmail": "{{adminEmail}}",
      "userPassword": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const payload = pm.response.json();
      pm.environment.set('adminAccessToken', payload.tokenResult.accessToken);
      pm.environment.set('adminRefreshToken', payload.tokenResult.refreshToken);
    language: text/javascript
order: 3000
